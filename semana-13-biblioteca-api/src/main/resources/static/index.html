<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            background-color: #f8f9fa;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        .container {
            max-width: 1000px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #mensaje {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="text-center mb-4">
        <h1 class="display-5 fw-bold text-primary">Biblioteca Personal</h1>
        <p class="lead text-muted">Gestión de libros registrados en el sistema</p>
    </header>

    <div id="mensaje" class="alert mb-4" role="alert"></div>
    <div class="card mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Registrar Nuevo Libro</h5>
        </div>
        <div class="card-body">
            <form id="formLibro">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="codigo" class="form-label">Código</label>
                        <input type="text" class="form-control" id="codigo" required maxlength="50">
                    </div>
                    <div class="col-md-4">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" required maxlength="150">
                    </div>
                    <div class="col-md-4">
                        <label for="autor" class="form-label">Autor</label>
                        <input type="text" class="form-control" id="autor" required maxlength="100">
                    </div>
                    <div class="col-md-4">
                        <label for="categoria" class="form-label">Categoría</label>
                        <input type="text" class="form-control" id="categoria" required maxlength="50">
                    </div>
                    <div class="col-md-4">
                        <label for="anioPublicacion" class="form-label">Año de Publicación</label>
                        <input type="number" class="form-control" id="anioPublicacion" min="1" required>
                    </div>
                    <div class="col-md-4">
                        <label for="precio" class="form-label">Precio</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" id="precio" required>
                    </div>
                    <div class="col-md-12 d-flex align-items-center mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="disponible" checked>
                            <label class="form-check-label" for="disponible">
                                Disponible
                            </label>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Guardar Libro</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Libros Registrados</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Categoría</th>
                        <th>Año</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody id="tablaLibros">

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/libros';
    function mostrarMensaje(texto, esExito) {
        const divMensaje = document.getElementById('mensaje');
        divMensaje.className = esExito ? 'alert alert-success mb-4' : 'alert alert-danger mb-4';
        divMensaje.textContent = texto;
        divMensaje.style.display = 'block';

        setTimeout(() => {
            divMensaje.style.display = 'none';
        }, 4000);
    }

    function cargarLibros() {
        fetch(API_URL)
            .then(respuesta => {
                if (!respuesta.ok) {
                    throw new Error("No fue posible completar la operación.");
                }
                return respuesta.json();
            })
            .then(libros => {
                const tbody = document.getElementById('tablaLibros');
                tbody.innerHTML = '';

                libros.forEach(libro => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${libro.codigo || ''}</td>
                        <td>${libro.titulo || ''}</td>
                        <td>${libro.autor || ''}</td>
                        <td>${libro.categoria || ''}</td>
                        <td>${libro.anioPublicacion || ''}</td>
                        <td>Q${parseFloat(libro.precio || 0).toFixed(2)}</td>
                        <td>
                            <span class="badge ${libro.disponible ? 'bg-success' : 'bg-secondary'}">
                                ${libro.disponible ? 'Disponible' : 'No disponible'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="eliminarLibro(${libro.id})">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            })
            .catch(error => {
                mostrarMensaje("No fue posible completar la operación.", false);
            });
    }

    document.getElementById('formLibro').addEventListener('submit', function (e) {
        e.preventDefault();

        const libro = {
            codigo: document.getElementById('codigo').value,
            titulo: document.getElementById('titulo').value,
            autor: document.getElementById('autor').value,
            categoria: document.getElementById('categoria').value,
            anioPublicacion: parseInt(document.getElementById('anioPublicacion').value),
            precio: parseFloat(document.getElementById('precio').value),
            disponible: document.getElementById('disponible').checked
        };

        fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(libro)
        })
            .then(respuesta => {
                if (respuesta.ok) {
                    mostrarMensaje("Libro registrado correctamente.", true);
                    document.getElementById('formLibro').reset();
                    document.getElementById('disponible').checked = true;
                    cargarLibros();
                } else {
                    mostrarMensaje("No fue posible completar la operación.", false);
                }
            })
            .catch(error => {
                mostrarMensaje("No fue posible completar la operación.", false);
            });
    });

    function eliminarLibro(id) {
        const confirmacion = confirm("¿Desea eliminar el libro seleccionado?");

        if (confirmacion) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
                .then(respuesta => {
                    if (respuesta.ok) {
                        mostrarMensaje("Libro eliminado correctamente.", true);
                        cargarLibros();
                    } else {
                        mostrarMensaje("No fue posible completar la operación.", false);
                    }
                })
                .catch(error => {
                    mostrarMensaje("No fue posible completar la operación.", false);
                });
        }
    }

    document.addEventListener('DOMContentLoaded', cargarLibros);
</script>
</body>
</html>
